name: Watch wa-js -> Discord e Telegram (releases + fix commits)

on:
  schedule:
    - cron: "*/30 * * * *"  # a cada 30 min
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pra salvar estado)
        uses: actions/checkout@v4

      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      ############################################################
      # 1) RELEASES
      ############################################################
      - name: Buscar último release do wa-js
        id: rel_fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/wppconnect-team/wa-js/releases/latest"

          code=$(curl -sS -o rel.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: gh-actions-release-watcher" \
            "$API")

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "GitHub API error (release) HTTP $code"
            cat rel.json || true
            exit 1
          fi

          jq -e . rel.json >/dev/null

          TAG=$(jq -r .tag_name rel.json)
          NAME=$(jq -r .name rel.json)
          URL=$(jq -r .html_url rel.json)
          BODY=$(jq -r .body rel.json)
          PUB_EPOCH=$(jq -r '.published_at | fromdate? // empty' rel.json)

          # Base64 do body para não quebrar o bash com aspas/novas linhas
          BODY_B64=$(printf "%s" "$BODY" | base64 -w0)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$URL"   >> "$GITHUB_OUTPUT"
          echo "pub_epoch=$PUB_EPOCH" >> "$GITHUB_OUTPUT"
          echo "body_b64=$BODY_B64" >> "$GITHUB_OUTPUT"

      - name: Lê estado de release salvo
        id: rel_state
        run: |
          mkdir -p .wa-js-state
          echo "last=$(cat .wa-js-state/last_tag 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Posta no Discord e Telegram (se release mudou)
        if: steps.rel_fetch.outputs.tag != steps.rel_state.outputs.last && steps.rel_fetch.outputs.tag != 'null'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          TAG="${{ steps.rel_fetch.outputs.tag }}"
          NAME="${{ steps.rel_fetch.outputs.name }}"
          URL="${{ steps.rel_fetch.outputs.url }}"
          PUB_EPOCH="${{ steps.rel_fetch.outputs.pub_epoch }}"
          BODY_RAW="$(echo '${{ steps.rel_fetch.outputs.body_b64 }}' | base64 -d)"

          # Limpeza do corpo: remove linhas redundantes (nome/versão), remove cabeçalho "## <tag>", colapsa múltiplas linhas vazias
          BODY_CLEAN=$(printf "%s\n" "$BODY_RAW" \
            | sed -E "s/\r//g" \
            | sed -E "/^${TAG//./\\.}\$/Id" \
            | sed -E "/^${NAME//./\\.}\$/Id" \
            | sed -E "s/^##[[:space:]]*${TAG//./\\.}.*//I" \
            | awk 'BEGIN{blank=0} { if(length($0)==0){ if(blank==0){ print ""; blank=1 } } else { print; blank=0 } }')

          BODY_TRUNC=$(printf "%s" "$BODY_CLEAN" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | head -c 1400)

          DESC=$(printf "*Publicado:* <t:%s:R>\n\n**Notas:**\n%s" "$PUB_EPOCH" "$BODY_TRUNC")

          payload=$(jq -n \
            --arg title "🧩 Nova versão: ${TAG}" \
            --arg url "$URL" \
            --arg desc "$DESC" \
            '{
              username: "Release Watcher",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5814783,
                footer: { text: "wppconnect-team/wa-js • release" }
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            PUB_HUMAN=""
            if [ -n "$PUB_EPOCH" ]; then
              PUB_HUMAN=$(date -u -d "@$PUB_EPOCH" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || true)
            fi
            TG_TEXT=$(printf '🧩 Nova versão: %s\n%s\n\n%s\n\nPublicado: %s\n\nNotas:\n%s' \
              "$TAG" "$NAME" "$URL" "${PUB_HUMAN:-—}" "$BODY_TRUNC")
            TG_TEXT=$(printf "%s" "$TG_TEXT" | head -c 4000)
            while IFS= read -r cid; do
              [ -z "$cid" ] && continue
              tg_payload=$(jq -n \
                --arg chat_id "$cid" \
                --arg text "$TG_TEXT" \
                '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$tg_payload"
            done < <(printf '%s' "$TELEGRAM_CHAT_ID" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
          fi

      - name: Atualiza estado de release
        if: steps.rel_fetch.outputs.tag != steps.rel_state.outputs.last && steps.rel_fetch.outputs.tag != 'null'
        run: |
          echo '${{ steps.rel_fetch.outputs.tag }}' > .wa-js-state/last_tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .wa-js-state/last_tag
          git commit -m "chore: wa-js last_tag -> ${{ steps.rel_fetch.outputs.tag }}" || echo "Nada pra commitar (release)"
          git push

      ############################################################
      # 2) FIX COMMITS NA BRANCH main (dedupe + robust fetch + safe text)
      ############################################################
      - name: Ler cursor de commits (ISO e SHA)
        id: fix_state
        run: |
          mkdir -p .wa-js-state
          if [[ -f .wa-js-state/last_fix_iso ]]; then
            echo "since=$(cat .wa-js-state/last_fix_iso)" >> "$GITHUB_OUTPUT"
            echo "lastsha=$(cat .wa-js-state/last_fix_sha 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
            echo "initial=false" >> "$GITHUB_OUTPUT"
          else
            echo "since=" >> "$GITHUB_OUTPUT"
            echo "lastsha=" >> "$GITHUB_OUTPUT"
            echo "initial=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar commits (normal ou bootstrap)
        id: fix_fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          INITIAL='${{ steps.fix_state.outputs.initial }}'
          SINCE='${{ steps.fix_state.outputs.since }}'
          LASTSHA='${{ steps.fix_state.outputs.lastsha }}'

          if [ "$INITIAL" = "true" ]; then
            API="https://api.github.com/repos/wppconnect-team/wa-js/commits?sha=main&per_page=100"
          else
            API="https://api.github.com/repos/wppconnect-team/wa-js/commits?sha=main&since=${SINCE}"
          fi

          code=$(curl -sS -o commits.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: gh-actions-fix-watcher" \
            "$API")

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "GitHub API error (commits) HTTP $code"
            cat commits.json || true
            exit 1
          fi

          jq -e . commits.json >/dev/null

          # Se não for array, força array vazio (não quebra jq depois)
          if [ "$(jq -r 'type' commits.json)" != "array" ]; then
            echo "Resposta de commits não é array. Conteúdo:"
            cat commits.json
            echo '[]' > commits.json
          fi

          # Filtra fixes + dedupe por ISO e SHA
          FILTERED=$(jq -c --arg last "${SINCE}" --arg lastsha "${LASTSHA}" '
            map({
              sha: .sha,
              url: .html_url,
              msg: .commit.message,
              author: (.commit.author.name // "desconhecido"),
              date_raw: .commit.author.date
            })
            | map(select(.msg | test("(?i)\\bfix|hotfix|bug|patch\\b")))
            | map(select(($last == "") or (.date_raw > $last)))
            | map(select(.sha != $lastsha))
          ' commits.json)

          COUNT=$(echo "$FILTERED" | jq -r 'length')

          SUMMARY=$(
            echo "$FILTERED" | jq -c '.[:5][]?' | while read -r row; do
              [ -z "$row" ] && continue
              EPOCH=$(echo "$row" | jq -r '.date_raw | fromdate? // empty')
              SHA=$(echo "$row" | jq -r .sha | cut -c1-7)
              URL=$(echo "$row" | jq -r .url)
              MSG=$(echo "$row" | jq -r '.msg | split("\n")[0]')
              AUTHOR=$(echo "$row" | jq -r .author)
              printf -- "- \`%s\` — %s\n👤 %s • 🕒 <t:%s:R>\n%s\n\n\n" "$SHA" "$MSG" "$AUTHOR" "$EPOCH" "$URL"
            done
          )

          # Cursor seguro: pega o maior author.date, soma 1s e converte pra ISO
          NEWEST_PLUS=$(jq -r '
            if length == 0 then
              ""
            else
              ([.[] | .commit.author.date | fromdate?] | max) as $t
              | ($t + 1 | todate)
            end
          ' commits.json)

          # SHA mais novo global (sem operador ?.)
          NEWEST_SHA=$(jq -r '
            if length == 0 then
              ""
            else
              ([.[] | {sha: .sha, date: .commit.author.date}] | max_by(.date) | .sha) // ""
            end
          ' commits.json)

          # Base64 do summary para não quebrar o bash no próximo step
          SUMMARY_B64=$(printf "%s" "$SUMMARY" | base64 -w0)

          {
            echo "count=$COUNT"
            echo "summary_b64=$SUMMARY_B64"
            echo "newest_plus=$NEWEST_PLUS"
            echo "newest_sha=$NEWEST_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Postar no Discord e Telegram (se houver fix-commits)
        if: steps.fix_fetch.outputs.count != '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          COUNT="${{ steps.fix_fetch.outputs.count }}"
          SUMMARY="$(echo '${{ steps.fix_fetch.outputs.summary_b64 }}' | base64 -d)"

          DESC_HEADER="**— Últimos fixes —**"
          EXTRA=""
          if [ "$COUNT" -gt 5 ]; then
            EXTRA=$(printf "\n…e +%s outros" "$((COUNT-5))")
          fi
          DESC=$(printf "%s\n\n%s%s" "$DESC_HEADER" "$SUMMARY" "$EXTRA")

          payload=$(jq -n \
            --arg desc "$DESC" \
            '{
              username: "Fix Watcher",
              embeds: [{
                title: "🛠️ Fix commits detectados na main",
                description: $desc,
                color: 16098851,
                footer: { text: "wppconnect-team/wa-js • commits" }
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            SUMMARY_TG=$(printf "%s" "$SUMMARY" | python3 -c "
import re, sys
from datetime import datetime, timezone
text = sys.stdin.read()
def repl(m):
    ts = int(m.group(1))
    return datetime.fromtimestamp(ts, tz=timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
print(re.sub(r'<t:(\d+):R>', repl, text))
")
            TG_TEXT=$(printf '🛠️ Fix commits na main (wppconnect-team/wa-js)\n\n— Últimos fixes —\n\n%s%s' "$SUMMARY_TG" "$EXTRA")
            TG_TEXT=$(printf "%s" "$TG_TEXT" | head -c 4000)
            while IFS= read -r cid; do
              [ -z "$cid" ] && continue
              tg_payload=$(jq -n \
                --arg chat_id "$cid" \
                --arg text "$TG_TEXT" \
                '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$tg_payload"
            done < <(printf '%s' "$TELEGRAM_CHAT_ID" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
          fi

      - name: Avançar cursor de commits
        if: steps.fix_fetch.outputs.newest_plus != '' || steps.fix_fetch.outputs.newest_sha != ''
        run: |
          mkdir -p .wa-js-state

          if [ -n '${{ steps.fix_fetch.outputs.newest_plus }}' ]; then
            echo '${{ steps.fix_fetch.outputs.newest_plus }}' > .wa-js-state/last_fix_iso
            git add .wa-js-state/last_fix_iso
          fi

          if [ -n '${{ steps.fix_fetch.outputs.newest_sha }}' ]; then
            echo '${{ steps.fix_fetch.outputs.newest_sha }}' > .wa-js-state/last_fix_sha
            git add .wa-js-state/last_fix_sha
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update fix cursors (iso+sha)" || echo "Nada pra commitar (commits)"
          git push